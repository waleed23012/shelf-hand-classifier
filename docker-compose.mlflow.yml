# MLflow tracking server + model registry, on your laptop and in the CI runner.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mlflow-data:
